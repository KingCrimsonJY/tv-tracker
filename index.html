<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>帧迹 Zhenji</title>
    <meta name="description" content="Personal Movie &amp; TV Watch Tracker · 个人影视进度追踪" />
    <meta property="og:title" content="帧迹 Zhenji" />
    <meta property="og:description" content="Personal Movie &amp; TV Watch Tracker · 个人影视进度追踪" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#121215" id="meta-theme-color" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="帧迹 Zhenji" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      (function () {
        var mode = 'dark';
        var locale = 'zh-CN';
        try {
          var saved = localStorage.getItem('zhenji_resolved_theme');
          if (saved === 'light' || saved === 'dark') {
            mode = saved;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            mode = 'light';
          }
          var savedLocale = localStorage.getItem('zhenji_resolved_locale');
          if (savedLocale === 'en' || savedLocale === 'zh-CN') {
            locale = savedLocale;
          } else if (navigator.language && navigator.language.toLowerCase().indexOf('en') === 0) {
            locale = 'en';
          }
        } catch (e) {}
        var root = document.documentElement;
        root.lang = locale;
        root.classList.remove('dark', 'light');
        root.classList.add(mode);
        root.setAttribute('data-theme', mode);
        var meta = document.getElementById('meta-theme-color');
        if (meta) {
          meta.setAttribute('content', mode === 'light' ? '#f5f5f8' : '#121215');
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-accent/30">
    <div id="root"></div>
    <!-- Keeps #root from being the last <div> in <body>. Overlays (menus, dialogs, toasts) are appended to
         <body>; when that changes whether #root is :last-of-type, the browser recalculates the style of the
         whole app, which is a long task on a large library. With this sibling the state never changes. -->
    <div hidden></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
