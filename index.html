<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>帧迹 · 私人观影进度追踪</title>
    <meta name="description" content="个人电影与剧集观看进度、剧集分集打卡与片单管理应用。" />
    <meta property="og:title" content="帧迹 · 私人观影进度追踪" />
    <meta property="og:description" content="个人电影与剧集观看进度、剧集分集打卡与片单管理应用。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#121215" id="meta-theme-color" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="帧迹" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function () {
        var mode = 'dark';
        try {
          var saved = localStorage.getItem('zhenji_resolved_theme');
          if (saved === 'light' || saved === 'dark') {
            mode = saved;
          } else if (
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches
          ) {
            mode = 'light';
          }
        } catch (e) {}
        var root = document.documentElement;
        root.classList.remove('dark', 'light');
        root.classList.add(mode);
        root.setAttribute('data-theme', mode);
        var meta = document.getElementById('meta-theme-color');
        if (meta) {
          meta.setAttribute('content', mode === 'light' ? '#f5f5f8' : '#121215');
        }
      })();
    </script>
  </head>
  <body class="bg-[var(--background)] text-[var(--foreground)] antialiased selection:bg-[var(--accent)]/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
