# Works with `docker compose` and `podman compose`. Image names are fully qualified because Podman has no
# default registry. The data directory must be writable by uid 1000 inside the container:
#   Docker:           mkdir -p data && sudo chown 1000:1000 data
#   Rootless Podman:  mkdir -p data && podman unshare chown 1000:1000 data
# See docs/deployment.md.
services:
  zhenji:
    build: .
    container_name: zhenji
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/data
    ports:
      # Loopback only: publish it through a tunnel or a reverse proxy that terminates HTTPS.
      - '127.0.0.1:8080:3000'
    volumes:
      # :Z relabels the directory for this container on SELinux hosts and is ignored elsewhere.
      - ./data:/data:Z

  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: zhenji-cloudflared
    profiles:
      - cloudflare
    restart: unless-stopped
    depends_on:
      - zhenji
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}

  tailscale:
    image: docker.io/tailscale/tailscale:latest
    container_name: zhenji-tailscale
    profiles:
      - tailscale
    restart: unless-stopped
    depends_on:
      - zhenji
    # `tailscale serve` only proxies to the machine it runs on, so this container shares the app's network
    # namespace and reaches it at 127.0.0.1:3000.
    network_mode: service:zhenji
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=zhenji
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
    volumes:
      - ./data/tailscale:/var/lib/tailscale:Z
